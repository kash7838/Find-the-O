<!DOCTYPE html>
<html>
<head>
    <title>Find the Sequence</title>
    <style>
        body {
            background-color: #add8e6; /* light blue */
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: black;
        }

        .sequence-box {
            display: inline-flex;
            gap: 10px;
            margin: 10px 0 20px 0;
        }

        .box {
            width: 60px;
            height: 60px;
            background-color: #f4c430; /* yolk yellow */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: red; /* letters red */
            border-radius: 8px;
            font-weight: bold;
        }

        .options {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
        }

        #score {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1 id="title">Find the Sequence</h1>

<div id="dynamicSequence" class="sequence-box"></div>

<br>

<input id="playerName" type="text" maxlength="15" placeholder="Enter Player Name (max 15)">
<br><br>

<div class="options">
    <button onclick="checkAnswer('A')">A. [X, X, O]</button>
    <button onclick="checkAnswer('B')">B. [O, X, X]</button>
    <button onclick="checkAnswer('C')">C. [X, O, X]</button>
</div>

<div id="score">Score: 0</div>

<script>
    const sequences = {
        A: ['X', 'X', 'O'],
        B: ['O', 'X', 'X'],
        C: ['X', 'O', 'X']
    };

    let correctKey = "";
    let score = 0;

    function loadSequence() {
        const keys = Object.keys(sequences);
        correctKey = keys[Math.floor(Math.random() * keys.length)];

        const seq = sequences[correctKey];

        const container = document.getElementById("dynamicSequence");
        container.innerHTML = "";

        seq.forEach(letter => {
            const div = document.createElement("div");
            div.className = "box";
            div.textContent = letter;
            container.appendChild(div);
        });

        document.getElementById("title").textContent = `Find the Sequence`;
    }

    function checkAnswer(choice) {
        const player = document.getElementById("playerName").value.trim();

        if (player.length === 0) {
            alert("Please enter your name first.");
            return;
        }

        if (choice === correctKey) {
            score += 10;
            alert("Correct! +10 points");
        } else {
            alert("Wrong choice!");
        }

        document.getElementById("score").textContent = `Score: ${score}`;
        loadSequence();
    }

    loadSequence();
</script>

</body>
</html>
